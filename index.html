.oem{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.98rem;letter-spacing:.02em;border-bottom:3px solid var(--hbs);align-self:flex-start;line-height:1.35;word-break:break-all}

.apli{color:var(--graxa);font-size:.75rem;line-height:1.35;flex:1}
.rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.cod{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:.71rem;color:var(--borracha)}
.zap{background:#1EBE57;color:#fff;text-decoration:none;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:.74rem;padding:8px 12px;border-radius:7px;white-space:nowrap}

const MAXL=15;
let lista=[];
try{ lista=JSON.parse(localStorage.getItem('hbs_lista')||'[]'); }catch(e){ lista=[]; }
function salvar(){ try{ localStorage.setItem('hbs_lista',JSON.stringify(lista)); }catch(e){} }
const idDe=c=>c.s+'|'+c.c;
const naLista=c=>lista.indexOf(idDe(c))>=0;
const cardDe=id=>D.find(c=>idDe(c)===id);
function alterna(id){
  const i=lista.indexOf(id);
  if(i>=0) lista.splice(i,1);
  else { if(lista.length>=MAXL){ alert('A lista chegou a '+MAXL+' pecas. Envie este pedido e comece outro.'); return; } lista.push(id); }
  salvar(); barraAtual();
  const dentro=lista.indexOf(id)>=0;
  document.querySelectorAll('[data-add="'+id+'"]').forEach(b=>{
    b.className='zap'+(dentro?' on':'');
    b.innerHTML=dentro?'&#10003; na lista':'+ Adicionar';
  });
  if(painelAberto) pintaPainel();
}
function barraAtual(){
  const b=document.getElementById('barra');
  const rod=document.querySelector('footer');
  if(!lista.length){ b.classList.remove('ver'); if(rod)rod.style.display=''; fechaPainel(); return; }
  b.classList.add('ver'); if(rod)rod.style.display='none';
  document.getElementById('qt').innerHTML=lista.length+(lista.length>1?' pecas na lista':' peca na lista')+
    '<small>toque para ver ou remover</small>';
}
let painelAberto=false;
function pintaPainel(){
  document.getElementById('itens').innerHTML=lista.map(id=>{
    const c=cardDe(id); if(!c) return '';
    return '<div class="item"><img src="'+c.f+'" alt=""><div class="txt"><b>'+(c.t==="HBS"?"HBS "+c.c:"Ref "+c.c)+
      '</b>'+c.n+'<br><span style="color:#777">'+c.o[0]+'</span></div>'+
      '<button data-rm="'+id+'">&times;</button></div>';
  }).join('');
}
function abrePainel(){ painelAberto=true; pintaPainel();
  document.getElementById('painel').classList.add('ver'); document.getElementById('fundo').classList.add('ver'); }
function fechaPainel(){ painelAberto=false;
  document.getElementById('painel').classList.remove('ver'); document.getElementById('fundo').classList.remove('ver'); }
function textoPedido(){
  const L=lista.map(cardDe).filter(Boolean);
  const curto=L.length>4;
  let t="Ola! Montei minha lista no catalogo da HBS:\n";
  L.forEach((c,i)=>{
    const ref=(c.t==="HBS"?"HBS ":"Ref ")+c.c;
    if(curto){ t+="\n"+(i+1)+") "+ref+" | "+c.o[0]+" - "+c.n.slice(0,40); }
    else { t+="\n"+(i+1)+") "+c.n+"\n"+ref+" | Original: "+c.o.slice(0,2).join(" / ")+(c.a?"\n"+c.a.slice(0,55):"")+"\n"; }
  });
  t+="\n\nPodem confirmar disponibilidade e valor?";
  return t;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'); if(a){ alterna(a.dataset.add); return; }
  const r=e.target.closest('[data-rm]');  if(r){ alterna(r.dataset.rm);  return; }
});
document.getElementById('qt').addEventListener('click',()=>painelAberto?fechaPainel():abrePainel());
document.getElementById('fechar').addEventListener('click',fechaPainel);
document.getElementById('fundo').addEventListener('click',fechaPainel);
document.getElementById('enviar').addEventListener('click',()=>{
  if(!lista.length) return;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(textoPedido()),"_blank");
});
barraAtual();

chipsSecao(); chipsMarca(); chipsGrupo(); render();
</script></body></html>
